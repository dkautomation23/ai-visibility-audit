name: Feature request
description: Suggest a check, a crawler to track, or a flag ai-visibility-audit doesn't have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to check or measure?
      description: >-
        A signal (a crawler, a structured-data type, a trust marker) or an
        output that ai-visibility-audit currently doesn't support.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should the tool do
      description: A new check, a new flag, a new output — be as concrete as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: A workaround, another tool, a manual check — helps judge how much this is worth.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
          required: false
