# GitHub's own static analysis, reading the paths the tests do not.
#
# Findings appear under Security -> Code scanning. A false positive is
# dismissed with a written reason, never by deleting the query.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0/init@4.38.0ea06614dafe4.38.06dec890db4.38.04464.38.026e0d40ce54.38.0d4 # v4.38.0
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0/analyze@4.38.0ea06614dafe4.38.06dec890db4.38.04464.38.026e0d40ce54.38.0d4 # v4.38.0
        with:
          category: "/language:python"
